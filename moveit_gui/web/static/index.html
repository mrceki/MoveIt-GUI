<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoveIt GUI</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="grp"><div class="big" id="h-robot">…</div></div>
  <div class="sep"></div>
  <div class="grp h-robotstate" id="h-stategrp">
    <div class="cap">Robot</div>
    <div class="val"><span class="dot" id="h-state-dot"></span><span id="h-state">—</span></div>
    <div class="sub" id="h-state-sub"></div>
  </div>
  <div class="grp"><div class="cap">Tool (TCP)</div><select id="h-tcp" data-needs-lease></select></div>
  <div class="grp"><div class="cap">Control</div><div class="val" id="h-mode">—</div></div>
  <div class="grp h-doing"><div class="cap">GUI is doing</div><div style="display:flex;gap:4px"><a class="pill" id="h-activity" title="What this GUI is doing now. Click to open its page.">Nothing</a><a class="pill rec" id="h-rec" hidden>● Rec</a><button class="btn" id="h-recbtn" type="button" title="Record joints, TCP pose, F/T, gripper, controllers and the live cameras (compressed) into one folder">● Record</button></div></div>
  <div class="grp hlay" id="h-layouts" hidden></div>
  <div class="spacer"></div>
  <div class="grp hinfo"><span class="hchip warn" id="h-conn" hidden></span></div>
  <div class="sep"></div>
  <div class="grp" title="GUI speed: scales every motion started from this GUI (moves, jog, programs). Policies are not scaled. The pendant speed slider (read-only here) scales it again.">
    <div class="cap">Speed <span class="capval" id="h-ovr-val">100%</span><span class="capsub"> · pendant <span id="h-speed">—</span></span></div>
    <input type="range" id="h-ovr" min="5" max="100" step="5" value="100" data-needs-lease>
  </div>
  <div class="sep"></div>
  <div id="lease">
    <button class="hchip users" id="h-users" type="button" title="Who has this GUI open">—</button>
    <span class="hchip view" id="lease-view" title="View only: buttons that move or change the robot are greyed out. Press Take control to operate. STOP always works."><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg> View only</span>
    <span class="who" id="lease-who">—</span>
    <button class="btn" id="lease-btn">Take control</button>
    <button class="btn quiet" id="lease-ask" type="button" hidden title="Ask whoever has control to give it to you (they get a pop-up: Give / Keep)">Ask</button>
  </div>
  <button id="stop" title="STOP GUI MOTION: program, MoveIt motion and policy. Not an emergency stop. (Esc)">■ STOP</button>
</header>
<div id="banner"></div>
<div id="body">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="logbar"><a class="btn quiet" id="logs-link">Logs ▸</a><span id="lastlog"></span></div>
<script type="importmap">{"imports": {"three": "/static/vendor/three/build/three.module.js"}}</script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
